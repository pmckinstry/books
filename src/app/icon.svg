<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#1E40AF"/>

  <!-- Closed book: light spine + white cover -->
  <!-- Spine -->
  <rect x="16" y="14" width="5" height="36" rx="2" fill="#BFDBFE"/>
  <!-- Cover -->
  <rect x="20" y="14" width="28" height="36" rx="4" fill="#FFFFFF"/>

  <!-- Page detail lines (subtle) -->
  <g stroke="#94A3B8" stroke-linecap="round" stroke-width="2" opacity="0.6">
    <line x1="25" y1="22" x2="42" y2="22" />
    <line x1="25" y1="28" x2="40" y2="28" />
    <line x1="25" y1="34" x2="38" y2="34" />
  </g>

  <!-- Bottom shadow line under book for depth -->
  <rect x="18" y="50" width="32" height="2" rx="1" fill="#0B2A7A" opacity="0.35"/>
</svg>
